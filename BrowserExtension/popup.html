<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vaulty</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="popup">
    <main>
      <p class="eyebrow">VAULTY</p>
      <h1 id="title">YouTube gate</h1>
      <p id="status" class="status"><span class="dot"></span> Checking…</p>
      <p id="copy" class="copy">Reading the local Vaulty guard.</p>
      <ul id="channels" class="channels" hidden></ul>
      <button id="session-action" type="button" disabled>Checking…</button>
      <button id="options" class="secondary popup-secondary" type="button">Channel settings</button>
      <p class="fine-print">Shorts, TikTok, and Reels stay blocked.</p>
    </main>
    <script src="policy.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
