<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FocusVault</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="popup">
    <main>
      <p class="eyebrow">FOCUSVAULT</p>

    <script src="policy.js"></script>
    <script src="popup.js"></script>
