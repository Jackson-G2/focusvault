name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run 58 core edge-case self-tests
        run: swift run focusvault-self-test
      - name: Build release binary
        run: swift build -c release
      - name: Package standalone macOS app
        run: ./scripts/package-app.sh
      - name: Run integration flow
        run: ./scripts/integration-test.sh
      - name: Run 42 channel-vault policy tests
        run: node BrowserExtension/tests/policy.test.js
